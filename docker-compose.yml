# 로컬 개발/검증용 구성 (인터넷 환경). 운영 OCP 배포는 helm/messenger 를 사용한다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/messenger
      DB_USERNAME: messenger
      DB_PASSWORD: messenger
      REDIS_HOST: redis
      JWT_SECRET: local-dev-secret-local-dev-secret-local-dev-secret
      ADMIN_PASSWORD: admin1234!
    volumes:
      - files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
  files:
