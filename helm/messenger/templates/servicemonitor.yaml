{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "messenger.fullname" . }}-backend
  labels:
    {{- include "messenger.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "messenger.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
