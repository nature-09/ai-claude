{{- if .Values.redis.enabled }}
{{- $fullname := include "messenger.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "messenger.labels" . | nindent 4 }}
    {{- include "messenger.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "messenger.selectorLabels" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messenger.selectorLabels" (dict "ctx" . "component" "redis") | nindent 8 }}
    spec:
      {{- include "messenger.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "messenger.image" (dict "ctx" . "image" .Values.redis.image) }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "messenger.secretName" . }}, key: REDIS_PASSWORD }
          volumeMounts:
            # 영속 데이터가 없으므로 emptyDir 사용
            - name: data
              mountPath: /var/lib/redis/data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "messenger.securityContext" . | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "messenger.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "messenger.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
