apiVersion: v1
kind: Secret
metadata:
  name: {{ include "messenger.secretName" . }}
  labels:
    {{- include "messenger.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ include "messenger.secretValue" (dict "ctx" . "key" "JWT_SECRET" "value" .Values.app.jwtSecret "length" 64) | quote }}
  ADMIN_PASSWORD: {{ include "messenger.secretValue" (dict "ctx" . "key" "ADMIN_PASSWORD" "value" .Values.app.adminPassword "length" 16) | quote }}
  {{- if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ include "messenger.secretValue" (dict "ctx" . "key" "DB_PASSWORD" "value" .Values.postgresql.password "length" 24) | quote }}
  {{- else if not .Values.externalDatabase.existingSecret }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ include "messenger.secretValue" (dict "ctx" . "key" "REDIS_PASSWORD" "value" .Values.redis.password "length" 24) | quote }}
  {{- else }}
  REDIS_PASSWORD: {{ .Values.externalRedis.password | quote }}
  {{- end }}
