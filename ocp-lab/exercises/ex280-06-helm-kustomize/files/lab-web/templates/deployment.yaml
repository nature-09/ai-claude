apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lab-web.fullname" . }}
  labels:
    {{- include "lab-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lab-web.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-web.selector" . | nindent 8 }}
    spec:
      containers:
      - name: lab-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: APP_MESSAGE
          value: {{ .Values.message | quote }}
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet: {path: /readyz, port: http}
        livenessProbe:
          httpGet: {path: /healthz, port: http}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
